version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deep_research_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/research.db
      - VECTOR_STORE_TYPE=faiss
      - SEARCH_API_TYPE=mock
      - FINANCIAL_API_TYPE=mock
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deep_research_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
